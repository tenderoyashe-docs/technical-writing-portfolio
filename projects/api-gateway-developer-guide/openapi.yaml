openapi: 3.0.3
info:
  title: Inventory API (Gateway Demo)
  version: 1.0.0
  description: >
    Portfolio demo. A local gateway proxies to a non-persistent inventory service.
    The sample API key is for local development only.
servers:
  - url: http://localhost:8000
    description: Local Kong Gateway proxy
security:
  - apiKeyAuth: []
paths:
  /inventory/health:
    get:
      summary: Check upstream health
      operationId: getHealth
      responses:
        "200":
          description: The upstream API is available
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
        "401":
          $ref: "#/components/responses/Unauthorized"
  /inventory/items:
    get:
      summary: List sample items
      operationId: listItems
      responses:
        "200":
          description: Inventory list
          content:
            application/json:
              schema:
                type: object
                required: [items, count]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Item"
                  count:
                    type: integer
                    example: 2
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Validate and return a sample new item
      description: Returns an example created item but does not persist it.
      operationId: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                category:
                  type: string
                  default: uncategorized
      responses:
        "201":
          description: Example item created (not persisted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          description: Request media type must be application/json
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: apikey
  responses:
    Unauthorized:
      description: Missing or invalid API key (generated by Kong Gateway)
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
  schemas:
    Item:
      type: object
      required: [id, name, category]
      properties:
        id:
          type: integer
          example: 3
        name:
          type: string
          example: Desk Lamp
        category:
          type: string
          example: lighting
    ApiError:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
